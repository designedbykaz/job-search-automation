<div class="panel p-4">
  <h2 class="section-title">Open search (GOV.UK Jobs)</h2>
  <p class="text-muted small mb-3">
    Enter one search term per line. Each term is combined with the optional location and sent to the GOV.UK scraper; unique jobs are logged to your Google Sheet with cluster <code>open_search</code>.
  </p>

  <form
    hx-post="{{ url_for('pipeline.run_open_search') }}"
    hx-target="#open-search-result"
    hx-swap="innerHTML"
    hx-disabled-elt="button[type='submit']">
    <div class="mb-3">
      <label class="form-label small" for="open-search-terms">Search terms</label>
      <textarea id="open-search-terms" name="terms" class="form-control font-monospace"
                rows="8" spellcheck="false"
                placeholder="e.g waiter&#10;bar staff&#10;admin assistant"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label small" for="open-search-location">Location (optional)</label>
      <input id="open-search-location" type="text" name="location" class="form-control"
             placeholder="e.g Slough, London, Leeds" autocomplete="off">
    </div>
    <button type="submit" class="btn btn-dark d-inline-flex align-items-center justify-content-center gap-2">
      <span class="spinner-border spinner-border-sm os-run-spinner" role="status" aria-hidden="true"></span>
      <span class="os-run-label"><i class="bi bi-play-fill"></i> Run Open Search</span>
    </button>
  </form>
  <p class="text-muted small mt-2 mb-0">
    This may take several minutes depending on the number of terms.
  </p>
  <div id="open-search-result" class="mt-3" aria-live="polite"></div>
</div>
