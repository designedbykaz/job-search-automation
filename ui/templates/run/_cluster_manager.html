<div class="card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Search Clusters</h5>
    <button type="button" class="btn btn-sm btn-primary" id="newClusterBtn">
      <i class="bi bi-plus-lg"></i> New cluster
    </button>
  </div>
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead>
        <tr>
          <th style="width: 50px;">Active</th>
          <th>Label</th>
          <th style="width: 120px;">Keywords</th>
          <th style="width: 100px;">Actions</th>
        </tr>
      </thead>
      <tbody id="clusterTableBody">
        <tr><td colspan="4" class="text-center text-muted">Loading clusters...</td></tr>
      </tbody>
    </table>
  </div>
</div>
