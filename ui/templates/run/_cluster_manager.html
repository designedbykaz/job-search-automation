<div class="panel mb-4">
  <div class="panel-header d-flex justify-content-between align-items-center">
    <span>Search clusters</span>
    <button type="button" class="btn btn-sm btn-dark" id="newClusterBtn">
      <i class="bi bi-plus-lg"></i> New cluster
    </button>
  </div>
  <table class="table table-hover mb-0 cluster-table">
    <thead>
      <tr>
        <th style="width: 50px;">Active</th>
        <th>Label</th>
        <th style="width: 120px;">Keywords</th>
        <th style="width: 100px;">Actions</th>
      </tr>
    </thead>
    <tbody id="clusterTableBody">
      <tr><td colspan="4" class="text-center text-muted">Loading clusters...</td></tr>
    </tbody>
  </table>
</div>
